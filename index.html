<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLANC COFFEE — Shop Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --coffee-primary: #4E2C1D;
      --coffee-primary-light: #7A4A33;
      --coffee-primary-container: #F3E9E2;
      --coffee-on-primary-container: #33160B;
      --matcha-secondary: #3B6737;
      --matcha-container: #E4EFE3;
      --matcha-on-container: #143012;
      --macadamia-tertiary: #A6711C;
      --macadamia-container: #FDF2DC;
      --macadamia-on-container: #382200;
      --shop-bg: #F8F5F1;
      --shop-surface: #FFFFFF;
      --shop-surface-variant: #EFE8E0;
      --shop-text-primary: #221B17;
      --shop-text-secondary: #6E645D;
      --shop-outline: #E0D7D0;
      --shop-card-shadow: 0 4px 20px rgba(78, 44, 29, 0.06);
      --income-green: #2E7D32;
      --income-bg: #E8F5E9;
      --outcome-red: #C62828;
      --outcome-bg: #FFEBEE;
      --warning-orange: #E65100;
      --warning-bg: #FFF3E0;
      --pending-blue: #1565C0;
      --pending-bg: #E3F2FD;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    [data-theme="dark"] {
      --coffee-primary: #E2B7A1;
      --coffee-primary-light: #C08C73;
      --coffee-primary-container: #381D11;
      --coffee-on-primary-container: #F8ECE5;
      --matcha-secondary: #A1D39D;
      --matcha-container: #234C20;
      --matcha-on-container: #E0F2DF;
      --macadamia-tertiary: #F7C880;
      --macadamia-container: #4C3105;
      --macadamia-on-container: #FEF6E8;
      --shop-bg: #161210;
      --shop-surface: #221C19;
      --shop-surface-variant: #2E2521;
      --shop-text-primary: #EFEAE5;
      --shop-text-secondary: #AEA39B;
      --shop-outline: #4D423B;
      --shop-card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --income-bg: #1B3320;
      --outcome-bg: #3B1B1B;
      --warning-bg: #3B2712;
      --pending-bg: #13273D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0d0c0b;
      color: var(--shop-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 10px;
      transition: background-color 0.3s;
    }

    /* Top Control Bar */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #F8F5F1;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand-pill span.logo-icon {
      background: linear-gradient(135deg, #7A4A33, #4E2C1D);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-toggle {
      background: #25201c;
      color: #ded6cf;
      border: 1px solid #3d352e;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-toggle:hover {
      background: #332b26;
      color: #fff;
    }

    /* Device Mockup Shell */
    .device-shell {
      width: 100%;
      max-width: 440px;
      height: 890px;
      max-height: 92vh;
      background: var(--shop-bg);
      border-radius: 44px;
      border: 8px solid #2b2520;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    .device-shell.fullscreen {
      max-width: 900px;
      height: 92vh;
      border-radius: 24px;
      border-width: 4px;
    }

    /* Phone Status Bar */
    .status-bar {
      height: 40px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--shop-text-primary);
      z-index: 10;
      flex-shrink: 0;
    }

    .camera-notch {
      width: 90px;
      height: 18px;
      background: #2b2520;
      border-radius: 0 0 12px 12px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    /* App Header */
    .app-header {
      padding: 8px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--shop-bg);
      flex-shrink: 0;
    }

    .header-title-wrap h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--shop-text-primary);
      letter-spacing: -0.3px;
    }

    .header-title-wrap p {
      font-size: 0.78rem;
      color: var(--shop-text-secondary);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-offline {
      background: var(--matcha-container);
      color: var(--matcha-secondary);
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-offline::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--matcha-secondary);
    }

    /* Main Scrollable Viewport */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 85px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .screen-content::-webkit-scrollbar {
      width: 4px;
    }
    .screen-content::-webkit-scrollbar-thumb {
      background: var(--shop-outline);
      border-radius: 4px;
    }

    /* Card Component */
    .card {
      background: var(--shop-surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 1px solid var(--shop-outline);
      box-shadow: var(--shop-card-shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    /* Hero Net Profit Card */
    .hero-card {
      background: linear-gradient(135deg, #4E2C1D 0%, #30170B 100%);
      color: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: 0 10px 28px rgba(78, 44, 29, 0.25);
      position: relative;
      overflow: hidden;
    }

    [data-theme="dark"] .hero-card {
      background: linear-gradient(135deg, #3A1F13 0%, #201108 100%);
      border: 1px solid rgba(226, 183, 161, 0.2);
    }

    .hero-card::after {
      content: '☕';
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 5rem;
      opacity: 0.12;
      pointer-events: none;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .hero-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.75);
      font-weight: 600;
    }

    .hero-period-pill {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #FFFFFF;
    }

    .hero-amount {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      color: #FFFFFF;
    }

    .hero-metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      background: rgba(0,0,0,0.18);
      border-radius: var(--radius-md);
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .metric-item {
      display: flex;
      flex-direction: column;
    }

    .metric-item .metric-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 2px;
    }

    .metric-item .metric-val {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .metric-val.green { color: #81C784; }
    .metric-val.red { color: #E57373; }
    .metric-val.gold { color: #FFD54F; }

    /* Period Filter Chips */
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--shop-surface-variant);
      color: var(--shop-text-secondary);
      border: 1px solid transparent;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--coffee-primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(78, 44, 29, 0.25);
    }

    [data-theme="dark"] .chip.active {
      background: var(--coffee-primary);
      color: #201108;
    }

    /* Low Stock Warning Banner */
    .alert-banner {
      background: var(--warning-bg);
      border: 1px solid rgba(230, 81, 0, 0.3);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .alert-banner:hover {
      transform: translateY(-1px);
    }

    .alert-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-icon {
      font-size: 1.25rem;
    }

    .alert-text h4 {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--warning-orange);
    }

    .alert-text p {
      font-size: 0.74rem;
      color: var(--shop-text-secondary);
    }

    .alert-btn {
      background: var(--warning-orange);
      color: #FFF;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Section Headings */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .section-head h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--shop-text-primary);
    }

    .section-head a, .section-head button {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--coffee-primary-light);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Category Breakdown Bars */
    .cat-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cat-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .cat-name-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .cat-dot.coffee { background: var(--coffee-primary-light); }
    .cat-dot.matcha { background: var(--matcha-secondary); }
    .cat-dot.macadamia { background: var(--macadamia-tertiary); }

    .cat-progress-track {
      height: 7px;
      background: var(--shop-surface-variant);
      border-radius: 10px;
      overflow: hidden;
    }

    .cat-progress-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cat-progress-fill.coffee { background: var(--coffee-primary-light); }
    .cat-progress-fill.matcha { background: var(--matcha-secondary); }
    .cat-progress-fill.macadamia { background: var(--macadamia-tertiary); }

    /* Recent Feed & Orders List */
    .item-card {
      background: var(--shop-surface);
      border-radius: var(--radius-md);
      padding: 14px;
      border: 1px solid var(--shop-outline);
      box-shadow: var(--shop-card-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .item-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--shop-text-primary);
    }

    .item-sub {
      font-size: 0.74rem;
      color: var(--shop-text-secondary);
      margin-top: 2px;
    }

    .item-badge {
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-pending { background: var(--pending-bg); color: var(--pending-blue); }
    .badge-preparing { background: var(--warning-bg); color: var(--warning-orange); }
    .badge-completed { background: var(--income-bg); color: var(--income-green); }
    .badge-cancelled { background: var(--outcome-bg); color: var(--outcome-red); }

    .badge-paid { background: var(--income-bg); color: var(--income-green); }
    .badge-unpaid { background: var(--outcome-bg); color: var(--outcome-red); }

    .order-items-preview {
      background: var(--shop-surface-variant);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.76rem;
      color: var(--shop-text-primary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .order-item-line {
      display: flex;
      justify-content: space-between;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed var(--shop-outline);
    }

    .total-price {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--coffee-primary-light);
    }

    [data-theme="dark"] .total-price {
      color: var(--coffee-primary);
    }

    .btn-action-sm {
      background: var(--shop-surface-variant);
      border: 1px solid var(--shop-outline);
      color: var(--shop-text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action-sm:hover {
      background: var(--coffee-primary);
      color: #FFFFFF;
      border-color: var(--coffee-primary);
    }

    .btn-primary-sm {
      background: var(--coffee-primary);
      border: none;
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    [data-theme="dark"] .btn-primary-sm {
      background: var(--coffee-primary);
      color: #1f1109;
    }

    /* Floating / Fixed Bottom Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--shop-surface);
      border-top: 1px solid var(--shop-outline);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      z-index: 20;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--shop-text-secondary);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      padding: 6px 0;
      border-radius: 12px;
      position: relative;
      transition: all 0.2s;
    }

    .nav-btn .icon {
      font-size: 1.25rem;
      transition: transform 0.2s;
    }

    .nav-btn.active {
      color: var(--coffee-primary);
    }

    [data-theme="dark"] .nav-btn.active {
      color: var(--coffee-primary);
    }

    .nav-btn.active .icon {
      transform: scale(1.15);
    }

    .nav-btn .badge-count {
      position: absolute;
      top: 2px;
      right: calc(50% - 18px);
      background: var(--outcome-red);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Sheet */
    .modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--shop-surface);
      border-radius: 28px 28px 0 0;
      padding: 22px 20px 28px;
      max-height: 84%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close {
      background: var(--shop-surface-variant);
      border: none;
      color: var(--shop-text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--shop-text-secondary);
    }

    .input-field, select.input-field {
      background: var(--shop-surface-variant);
      border: 1px solid var(--shop-outline);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.88rem;
      color: var(--shop-text-primary);
      outline: none;
      font-family: inherit;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--coffee-primary-light);
    }

    .btn-submit {
      background: var(--coffee-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 14px rgba(78, 44, 29, 0.25);
    }

    [data-theme="dark"] .btn-submit {
      background: var(--coffee-primary);
      color: #24140a;
    }

    /* Receipt Slip Styling */
    .receipt-slip {
      background: #FFFFFF;
      color: #1a1a1a;
      border: 1px dashed #bbb;
      border-radius: 12px;
      padding: 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .receipt-title {
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .receipt-divider {
      border-bottom: 1px dashed #888;
      margin: 10px 0;
    }

    /* Floating Action Button (FAB) */
    .fab {
      position: absolute;
      bottom: 82px;
      right: 20px;
      background: var(--coffee-primary);
      color: #FFFFFF;
      width: 52px;
      height: 52px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(78, 44, 29, 0.35);
      z-index: 25;
      transition: transform 0.2s;
    }

    .fab:hover {
      transform: scale(1.08);
    }

    [data-theme="dark"] .fab {
      background: var(--coffee-primary);
      color: #201108;
    }

    /* Search Bar */
    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      padding-left: 36px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--shop-text-secondary);
      font-size: 0.85rem;

    function formatRawQty(qty, unit) {
      const n = Number(qty) || 0;
      const q = Number.isInteger(n) ? n.toString() : (Math.round(n * 100) / 100).toString();
      return q + ' ' + unit;
    }

      const diff = Math.floor((Date.now() - timestamp) / 1000);
      if (diff < 60) return "Just now";
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;

                  <div class="item-title">${order.orderNumber} • ${order.customerName}</div>

    function onOrderSearch(val) {
      STATE.customerSearchQuery = val;
      renderOrders(document.getElementById('screenContent'));
    }

    function setOrderStatusFilter(status) {
      STATE.orderStatusFilter = status;
      renderCurrentScreen();
    }

    function advanceOrderStatus(orderId, nextStatus) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;
      order.status = nextStatus;

      // Idempotent Income recording when completed if unpaid
      if (nextStatus === 'COMPLETED' && order.paymentStatus === 'UNPAID') {
        order.paymentStatus = 'PAID';
        STATE.transactions.unshift({
          id: Date.now(),
          type: 'INCOME',
          category: 'ORDER_SALE',
          amount: order.totalAmount,
          title: `Order #${order.orderNumber} - ${order.customerName}`,
          note: `Payment collected upon order completion`,
          timestamp: Date.now(),
          refOrder: order.orderNumber
        });
      }

      showToast(`Order ${order.orderNumber} marked as ${nextStatus}!`);
      updateBadges();
      renderCurrentScreen();
    }

    function cancelOrder(orderId) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;

      if (!confirm(`Cancel order ${order.orderNumber}? This will restore inventory and issue a refund if paid.`)) return;

      order.status = 'CANCELLED';

      // Restore stock
      order.items.forEach(item => {
        const prod = STATE.products.find(p => p.id === item.productId);
        if (prod) prod.stock += item.quantity;
      });

      // Compensating refund transaction if it was paid
      if (order.paymentStatus === 'PAID') {
        STATE.transactions.unshift({
          id: Date.now(),
          type: 'OUTCOME',
          category: 'ORDER_REFUND',
          amount: order.totalAmount,
          title: `Refund: Order #${order.orderNumber}`,
          note: `Compensating refund for cancelled order`,
          timestamp: Date.now(),
          refOrder: order.orderNumber
        });
      }

      showToast(`Order ${order.orderNumber} cancelled. Stock restored.`);
      updateBadges();
      renderCurrentScreen();
    }

    // 3. INVENTORY SCREEN (Products | Raw Materials tabs)
    function renderInventory(container) {
      if (STATE.inventoryTab === 'raw') {
        renderRawMaterials(container);
        return;
      }
      const filteredProducts = STATE.products.filter(p => {
        const matchesCategory = STATE.inventoryCategoryFilter === 'ALL' 
          ? true 
          : STATE.inventoryCategoryFilter === 'LOW_STOCK'
            ? p.stock <= p.minStock
            : p.category === STATE.inventoryCategoryFilter;
        const matchesSearch = !STATE.inventorySearchQuery ||
          p.name.toLowerCase().includes(STATE.inventorySearchQuery.toLowerCase()) ||
          p.sku.toLowerCase().includes(STATE.inventorySearchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      // Sort
      if (STATE.inventorySort === 'stock') {
        filteredProducts.sort((a, b) => a.stock - b.stock);
      } else if (STATE.inventorySort === 'margin') {
        filteredProducts.sort((a, b) => ((b.price - b.cost) / b.price) - ((a.price - a.cost) / a.price));
      } else {
        filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
      }

      const lowStockCount = STATE.products.filter(p => p.stock <= p.minStock).length;

      container.innerHTML = `
        <!-- Products | Raw Materials tabs -->
        <div class="chips-row" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button class="chip active" style="text-align:center;">📦 Products (${STATE.products.length})</button>
          <button class="chip" style="text-align:center;" onclick="setInventoryTab('raw')">🌾 Raw Materials (${STATE.rawMaterials.length})</button>
        </div>

        <!-- Search bar -->
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="input-field" placeholder="Search product name or SKU..." 
            value="${STATE.inventorySearchQuery}" oninput="onInventorySearch(this.value)">
        </div>

        <!-- Filter Chips -->
        <div class="chips-row">
          <button class="chip ${STATE.inventoryCategoryFilter === 'ALL' ? 'active' : ''}" onclick="setInventoryCategory('ALL')">All (${STATE.products.length})</button>
          <button class="chip ${STATE.inventoryCategoryFilter === 'COFFEE' ? 'active' : ''}" onclick="setInventoryCategory('COFFEE')">Coffee</button>
          <button class="chip ${STATE.inventoryCategoryFilter === 'GREEN_TEA' ? 'active' : ''}" onclick="setInventoryCategory('GREEN_TEA')">Green Tea</button>
          <button class="chip ${STATE.inventoryCategoryFilter === 'MACADAMIA_NUT' ? 'active' : ''}" onclick="setInventoryCategory('MACADAMIA_NUT')">Macadamia</button>
          <button class="chip ${STATE.inventoryCategoryFilter === 'LOW_STOCK' ? 'active' : ''}" style="${lowStockCount > 0 ? 'border-color:var(--warning-orange);' : ''}" onclick="setInventoryCategory('LOW_STOCK')">⚠️ Low Stock (${lowStockCount})</button>
        </div>

        <!-- Products Grid -->
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${filteredProducts.length === 0 ? `
            <div style="text-align:center; padding:40px 20px; color:var(--shop-text-secondary);">
              <span style="font-size:2.5rem;">📦</span>
              <p style="margin-top:10px; font-weight:600;">No products match this filter</p>
            </div>
          ` : filteredProducts.map(p => {
            const margin = Math.round(((p.price - p.cost) / p.price) * 100);
            const isLow = p.stock <= p.minStock;
            const isOut = p.stock === 0;
            const stockClass = isOut ? 'stock-out' : isLow ? 'stock-low' : 'stock-healthy';
            const stockText = isOut ? 'Out of Stock (0)' : isLow ? `Low Stock (${p.stock} ${p.unit})` : `${p.stock} ${p.unit}`;

            return `
              <div class="item-card prod-card">
                <div class="prod-top">
                  <div>
                    <span class="prod-sku">${p.sku}</span>
                    <h4 style="font-size:0.92rem; margin-top:3px; font-weight:700;">${p.name}</h4>
                    <p style="font-size:0.72rem; color:var(--shop-text-secondary); margin-top:2px;">${p.desc}</p>
                  </div>
                  <span class="stock-badge ${stockClass}">${stockText}</span>
                </div>

                <div class="price-row">
                  <div>
                    <div class="selling-price">${formatMMK(p.price)}</div>
                    <div class="cost-price">Cost: ${formatMMK(p.cost)} • Min: ${p.minStock} ${p.unit}</div>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span class="margin-pill">${margin}% margin</span>
                    <button class="btn-primary-sm" onclick="openRestockModal(${p.id})">Restock</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function onInventorySearch(val) {
      STATE.inventorySearchQuery = val;
      renderInventory(document.getElementById('screenContent'));

    function setInventoryCategory(cat) {

        <!-- Products | Raw Materials tabs -->

          <button class="chip" style="text-align:center;" onclick="setInventoryTab('products')">📦 Products (${STATE.products.length})</button>
          <button class="chip active" style="text-align:center;">🌾 Raw Materials (${STATE.rawMaterials.length})</button>
        </div>

          <div class="alert-banner" style="cursor:default;">
            <div class="alert-content">
              <span class="alert-icon">⚠️</span>

            const stockText = isOut ? 'Out of stock' : isLow ? `Low: ${formatRawQty(m.stock, m.unit)}` : formatRawQty(m.stock, m.unit);

            return `
              <div class="item-card prod-card">
                <div class="prod-top">
                  <div>
                    <span class="prod-sku">${m.sku || 'RAW'}</span>

                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; background:var(--shop-surface-variant); border-radius:8px; padding:8px 10px; margin-top:8px;">

                    <div style="font-size:0.68rem; color:var(--income-green); font-weight:700;">BOUGHT</div>

                    <div style="font-size:0.68rem; color:var(--outcome-red); font-weight:700;">USED</div>

                </div>

                <div style="font-size:0.72rem; color:var(--shop-text-secondary); margin-top:6px;">

                </div>

          </div>

          </div>

        <div class="form-group">
          <label>Supplier / note (optional)</label>

    function submitNewRaw() {
      const name = document.getElementById('newRawName').value.trim();
      if (!name) { alert("Please enter a name."); return; }
      const unit = document.getElementById('newRawUnit').value.trim() || 'units';
      const stock = parseFloat(document.getElementById('newRawStock').value) || 0;
      const minStock = parseFloat(document.getElementById('newRawMin').value) || 0;
      const sku = document.getElementById('newRawSku').value.trim() || ('RAW-' + Date.now().toString().slice(-4));
      const note = document.getElementById('newRawNote').value.trim();
      STATE.rawMaterials.push({ id: Date.now(), name, unit, stock, minStock, costPerUnit: 0, sku, note });
      closeModal();
      showToast(name + " added to raw stock!");
      updateBadges();
      renderCurrentScreen();
    }

    function deleteRawMaterial(materialId) {
      const m = STATE.rawMaterials.find(x => x.id === materialId);
      if (!m) return;
      if (!confirm("Delete " + m.name + "? History + recipe links are removed too.")) return;
      STATE.rawMaterials = STATE.rawMaterials.filter(x => x.id !== materialId);
      STATE.rawMovements = STATE.rawMovements.filter(x => x.materialId !== materialId);
      STATE.recipes = STATE.recipes.filter(x => x.materialId !== materialId);
      showToast(m.name + " deleted.");
      updateBadges();
      renderCurrentScreen();
    }

    function openBuyRawModal(materialId) {
      const m = STATE.rawMaterials.find(x => x.id === materialId);
      if (!m) return;
      const html = `
        <div class="modal-header">
          <h3>Buy: ${m.name}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="background:var(--shop-surface-variant); padding:12px; border-radius:12px; font-size:0.82rem;">
          <div><strong>Remaining now:</strong> ${formatRawQty(m.stock, m.unit)}</div>
          <div><strong>Bought so far:</strong> ${formatRawQty(rawBought(m.id), m.unit)} • <strong>Used:</strong> ${formatRawQty(rawUsed(m.id), m.unit)}</div>
        </div>
        <div class="form-group">
          <label>Quantity bought (${m.unit}) — date = today</label>
          <input type="number" class="input-field" id="buyRawQty" value="10" step="any" min="0">
        </div>
        <div class="form-group">
          <label>Total cost in MMK (→ expense)</label>
          <input type="number" class="input-field" id="buyRawCost" value="${m.costPerUnit ? (10 * m.costPerUnit) : ''}" placeholder="e.g. 950000">
        </div>
        <div class="form-group">
          <label>Supplier / batch note</label>
          <input type="text" class="input-field" id="buyRawNote" placeholder="Shan harvest lot, invoice #">
        </div>
        <button class="btn-submit" onclick="submitBuyRaw(${m.id})">Confirm Buy</button>
      `;
      openModal(html);
    }

    function submitBuyRaw(materialId) {
      const m = STATE.rawMaterials.find(x => x.id === materialId);
      if (!m) return;
      const qty = parseFloat(document.getElementById('buyRawQty').value) || 0;
      const cost = parseFloat(document.getElementById('buyRawCost').value) || 0;
      const note = document.getElementById('buyRawNote').value.trim() || ("Bought " + qty + " " + m.unit);
      if (qty <= 0) { alert("Quantity must be greater than 0"); return; }
      m.stock += qty;
      STATE.rawMovements.unshift({ id: Date.now(), materialId, type: "PURCHASE", qty, cost, note, timestamp: Date.now() });
      if (cost > 0) {
        STATE.transactions.unshift({ id: Date.now() + 1, type: "OUTCOME", category: "RESTOCKING", amount: cost, title: "Raw buy: " + m.name + " (+" + qty + " " + m.unit + ")", note, timestamp: Date.now() });
      }
      closeModal();
      showToast("Added " + formatRawQty(qty, m.unit) + " — expense logged.");
      updateBadges();
      renderCurrentScreen();
    }

    function saveRecipe(materialId) {
      STATE.products.forEach(p => {
        const el = document.getElementById('recipe_' + p.id);
        if (!el) return;
        const qty = parseFloat(el.value) || 0;
        const idx = STATE.recipes.findIndex(r => r.productId === p.id && r.materialId === materialId);
        if (qty > 0) {
          if (idx >= 0) STATE.recipes[idx].qtyPerUnit = qty;
          else STATE.recipes.push({ productId: p.id, materialId, qtyPerUnit: qty });
        } else if (idx >= 0) {
          STATE.recipes.splice(idx, 1);
        }
      });

      showToast("Recipe links saved — sales now auto-deduct raw stock.");
      renderCurrentScreen();
    }

    function adjustDraftItem(prodId, delta) {
      const p = STATE.products.find(prod => prod.id === prodId);
      if (!p) return;
      const current = window._orderDraft.selectedProducts[prodId] || 0;
      const target = current + delta;
      if (target < 0) return;
      if (target > p.stock) {
        alert(`Cannot add more: Only ${p.stock} ${p.unit} currently in stock.`);
        return;
      }

      if (target === 0) {
        delete window._orderDraft.selectedProducts[prodId];
      } else {
        window._orderDraft.selectedProducts[prodId] = target;
      }

      const qtyEl = document.getElementById(`draftQty_${prodId}`);
      if (qtyEl) qtyEl.innerText = target;

      // Update total
      let total = 0;
      for (const [id, q] of Object.entries(window._orderDraft.selectedProducts)) {
        const itemP = STATE.products.find(prod => prod.id === parseInt(id));
        if (itemP) total += (itemP.price * q);
      }
      document.getElementById('draftTotalAmount').innerText = formatMMK(total);
    }

    function submitDraftOrder() {
      const draft = window._orderDraft;
      if (!draft.name.trim()) {
        alert("Please enter customer name.");
        return;
      }
      const itemKeys = Object.keys(draft.selectedProducts);
      if (itemKeys.length === 0) {
        alert("Please select at least one item.");
        return;
      }

      // Generate ORD-#
      const maxNum = STATE.orders.reduce((max, o) => {
        const num = parseInt(o.orderNumber.replace('ORD-', '')) || 0;
        return Math.max(max, num);
      }, 1000);
      const nextOrdNum = `ORD-${maxNum + 1}`;

      const items = [];
      let totalAmount = 0;
      let totalCost = 0;

      for (const [prodIdStr, qty] of Object.entries(draft.selectedProducts)) {
        const prod = STATE.products.find(p => p.id === parseInt(prodIdStr));
        if (prod) {
          prod.stock -= qty; // Deduct inventory
          totalAmount += (prod.price * qty);
          totalCost += (prod.cost * qty);
          items.push({
            productId: prod.id,
            productName: prod.name,
            quantity: qty,
            price: prod.price
          });
          // Auto-consume raw ingredients via recipes (never blocks the sale)
          STATE.recipes
            .filter(r => r.productId === prod.id)
            .forEach(r => {
              const raw = STATE.rawMaterials.find(m => m.id === r.materialId);
              if (!raw) return;
              const needed = r.qtyPerUnit * qty;
              if (needed <= 0) return;
              raw.stock = Math.max(0, raw.stock - needed);
              STATE.rawMovements.unshift({
                id: Date.now() + Math.floor(Math.random() * 1000),
                materialId: raw.id,
                type: "USAGE",
                qty: needed,
                cost: 0,
                note: "Auto-use for " + nextOrdNum + " (" + prod.name + " x" + qty + ")",
                timestamp: Date.now()
              });
            });
        }
      }

      const newOrder = {
        id: Date.now(),
        orderNumber: nextOrdNum,
        customerName: draft.name,
        customerPhone: draft.phone || "+95 9 12345678",
        customerNote: draft.note || "",
        status: "PENDING",
        paymentStatus: draft.isPaid ? "PAID" : "UNPAID",
        paymentMethod: draft.paymentMethod,
        totalAmount,
        totalCost,
        timestamp: Date.now(),
        items
      };

      STATE.orders.unshift(newOrder);

      // Record income if paid
      if (draft.isPaid) {
        STATE.transactions.unshift({
          id: Date.now() + 1,
          type: "INCOME",
          category: "ORDER_SALE",
          amount: totalAmount,
          title: `Order #${nextOrdNum} - ${draft.name}`,
          note: items.map(i => `${i.quantity}x ${i.productName}`).join(', '),
          timestamp: Date.now(),
          refOrder: nextOrdNum
        });
      }

      closeModal();
      showToast(`Order ${nextOrdNum} placed successfully!`);
      updateBadges();
      renderCurrentScreen();
      openOrderReceipt(newOrder.id);
    }

      document.getElementById('restockTotalExpense').innerText = formatMMK(qty * cost);
    }

    function submitRestock(prodId) {
      const prod = STATE.products.find(p => p.id === prodId);
      if (!prod) return;

      const qty = parseInt(document.getElementById('restockQty').value) || 0;
      const cost = parseFloat(document.getElementById('restockCost').value) || 0;
      const note = document.getElementById('restockNote').value || "Inventory restocking batch";

      if (qty <= 0) {
        alert("Quantity must be greater than 0");
        return;
      }

      prod.stock += qty;
      prod.cost = cost;

      // Auto-log Restocking Expense in Finance
      STATE.transactions.unshift({
        id: Date.now(),
        type: "OUTCOME",
        category: "RESTOCKING",
        amount: qty * cost,
        title: `Restocked ${qty}x ${prod.name}`,
        note: note,
        timestamp: Date.now()
      });

      closeModal();
      showToast(`Added ${qty} ${prod.unit} to stock! Expense recorded in Finance.`);
      updateBadges();
      renderCurrentScreen();
    }

    // Modal 4: Add New Transaction to Finance
    function openAddTransactionModal() {
      const html = `
        <div class="modal-header">
          <h3>Record Transaction</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div class="form-group">
          <label>Transaction Type</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="chip active" id="txTypeInc" onclick="setDraftTxType('INCOME')" style="text-align:center;">Inflow (+ Income)</button>
            <button class="chip" id="txTypeOut" onclick="setDraftTxType('OUTCOME')" style="text-align:center;">Outflow (- Expense)</button>
          </div>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select class="input-field" id="txCategory">
            <option value="ORDER_SALE">Order Sale</option>
            <option value="WHOLESALE">Wholesale Sale</option>
            <option value="RESTOCKING">Restocking Expense</option>
            <option value="PACKAGING">Packaging & Labels</option>
            <option value="UTILITIES">Utilities & Power</option>
            <option value="EQUIPMENT">Equipment & Maintenance</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Amount in MMK</label>
          <input type="number" class="input-field" id="txAmount" placeholder="e.g. 50000">
        </div>

        <div class="form-group">
          <label>Title / Description</label>
          <input type="text" class="input-field" id="txTitle" placeholder="e.g. Grinder burr replacement">
        </div>

        <div class="form-group">
          <label>Notes</label>
          <input type="text" class="input-field" id="txNote" placeholder="Additional details...">
        </div>

        <button class="btn-submit" onclick="submitTransaction()">Save Entry</button>
      `;

      window._draftTxType = 'INCOME';
      openModal(html);
    }

    function setDraftTxType(type) {
      window._draftTxType = type;
      document.getElementById('txTypeInc').classList.toggle('active', type === 'INCOME');
      document.getElementById('txTypeOut').classList.toggle('active', type === 'OUTCOME');
    }

    function submitTransaction() {
      const amount = parseFloat(document.getElementById('txAmount').value) || 0;
      const title = document.getElementById('txTitle').value.trim();
      const cat = document.getElementById('txCategory').value;
      const note = document.getElementById('txNote').value.trim();

      if (amount <= 0 || !title) {
        alert("Please provide a valid amount and title.");
        return;
      }

      STATE.transactions.unshift({
        id: Date.now(),
        type: window._draftTxType,
        category: cat,
        amount: amount,
        title: title,
        note: note,
        timestamp: Date.now()
      });

      closeModal();
      showToast("Transaction saved to ledger!");
      renderCurrentScreen();
    }

    // Modal 5: Add Product
    function openAddProductModal() {
      const html = `
        <div class="modal-header">
          <h3>Add Product to Catalog</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div class="form-group">
          <label>Product Name</label>
          <input type="text" class="input-field" id="newProdName" placeholder="e.g. Cascara Coffee Cherry Tea">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select class="input-field" id="newProdCategory">
            <option value="COFFEE">Coffee</option>
            <option value="GREEN_TEA">Green Tea</option>
            <option value="MACADAMIA_NUT">Macadamia Nut</option>
          </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Cost Price (MMK)</label>
            <input type="number" class="input-field" id="newProdCost" placeholder="8000">
          </div>
          <div class="form-group">
            <label>Selling Price (MMK)</label>
            <input type="number" class="input-field" id="newProdPrice" placeholder="15000">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Initial Stock</label>
            <input type="number" class="input-field" id="newProdStock" placeholder="20">
          </div>
          <div class="form-group">
            <label>Unit (bags, tins, pouches)</label>
            <input type="text" class="input-field" id="newProdUnit" placeholder="bags">
          </div>
        </div>

        <div class="form-group">
          <label>SKU Code</label>
          <input type="text" class="input-field" id="newProdSku" placeholder="e.g. TEA-CAS-100">
        </div>

        <button class="btn-submit" onclick="submitNewProduct()">Add to Inventory</button>
      `;

      openModal(html);
    }

    function submitNewProduct() {
      const name = document.getElementById('newProdName').value.trim();
      const cat = document.getElementById('newProdCategory').value;
      const cost = parseFloat(document.getElementById('newProdCost').value) || 0;
      const price = parseFloat(document.getElementById('newProdPrice').value) || 0;
      const stock = parseInt(document.getElementById('newProdStock').value) || 0;
      const unit = document.getElementById('newProdUnit').value.trim() || 'units';
      const sku = document.getElementById('newProdSku').value.trim() || `PRD-${Date.now().toString().slice(-4)}`;

      if (!name || price <= 0) {
        alert("Please enter product name and selling price.");
        return;
      }

      STATE.products.push({
        id: Date.now(),
        name,
        category: cat,
        cost,
        price,
        stock,
        unit,
        minStock: 5,
        sku,
        desc: "Specialty item added to catalog."
      });

      closeModal();
      showToast(`${name} added to catalog!`);
      updateBadges();
      renderCurrentScreen();
    }

    // --- Controls: Theme & View Toggles ---
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('themeIcon').innerText = next === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeToggleBtn').innerHTML = next === 'dark' 
        ? '<span id="themeIcon">☀️</span> Light' 
        : '<span id="themeIcon">🌙</span> Dark';
    }

    function toggleViewSize() {
      const shell = document.getElementById('deviceShell');
      const isFull = shell.classList.toggle('fullscreen');
      document.getElementById('viewIcon').innerText = isFull ? '💻' : '📱';
      document.getElementById('viewToggleBtn').innerHTML = isFull 
        ? '<span id="viewIcon">📱</span> Mobile Frame' 
        : '<span id="viewIcon">💻</span> Expanded View';
    }

    // Live Clock in Status Bar
    function updateClock() {
      const d = new Date();
      let h = d.getHours();
      let m = d.getMinutes();
      if (m < 10) m = '0' + m;
      document.getElementById('clockTime').innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 10000);
    updateClock();

    // Initial render
    switchTab('dashboard');
  </script>
</body>
</html>
