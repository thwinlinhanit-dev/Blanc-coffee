<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLANC COFFEE — Shop Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --coffee-primary: #4E2C1D;
      --coffee-primary-light: #7A4A33;
      --coffee-primary-container: #F3E9E2;
      --coffee-on-primary-container: #33160B;
      --matcha-secondary: #3B6737;
      --matcha-container: #E4EFE3;
      --matcha-on-container: #143012;
      --macadamia-tertiary: #A6711C;
      --macadamia-container: #FDF2DC;
      --macadamia-on-container: #382200;
      --shop-bg: #F8F5F1;
      --shop-surface: #FFFFFF;
      --shop-surface-variant: #EFE8E0;
      --shop-text-primary: #221B17;
      --shop-text-secondary: #6E645D;
      --shop-outline: #E0D7D0;
      --shop-card-shadow: 0 4px 20px rgba(78, 44, 29, 0.06);
      --income-green: #2E7D32;
      --income-bg: #E8F5E9;
      --outcome-red: #C62828;
      --outcome-bg: #FFEBEE;
      --warning-orange: #E65100;
      --warning-bg: #FFF3E0;
      --pending-blue: #1565C0;
      --pending-bg: #E3F2FD;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    [data-theme="dark"] {
      --coffee-primary: #E2B7A1;
      --coffee-primary-light: #C08C73;
      --coffee-primary-container: #381D11;
      --coffee-on-primary-container: #F8ECE5;
      --matcha-secondary: #A1D39D;
      --matcha-container: #234C20;
      --matcha-on-container: #E0F2DF;
      --macadamia-tertiary: #F7C880;
      --macadamia-container: #4C3105;
      --macadamia-on-container: #FEF6E8;
      --shop-bg: #161210;
      --shop-surface: #221C19;
      --shop-surface-variant: #2E2521;
      --shop-text-primary: #EFEAE5;
      --shop-text-secondary: #AEA39B;
      --shop-outline: #4D423B;
      --shop-card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --income-bg: #1B3320;
      --outcome-bg: #3B1B1B;
      --warning-bg: #3B2712;
      --pending-bg: #13273D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0d0c0b;
      color: var(--shop-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 10px;
      transition: background-color 0.3s;
    }

    /* Top Control Bar */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #F8F5F1;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand-pill span.logo-icon {
      background: linear-gradient(135deg, #7A4A33, #4E2C1D);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-toggle {
      background: #25201c;
      color: #ded6cf;
      border: 1px solid #3d352e;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-toggle:hover {
      background: #332b26;
      color: #fff;
    }

    /* Device Mockup Shell */
    .device-shell {
      width: 100%;
      max-width: 440px;
      height: 890px;
      max-height: 92vh;
      background: var(--shop-bg);
      border-radius: 44px;
      border: 8px solid #2b2520;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    .device-shell.fullscreen {
      max-width: 900px;
      height: 92vh;
      border-radius: 24px;
      border-width: 4px;
    }

    /* Phone Status Bar */
    .status-bar {
      height: 40px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--shop-text-primary);
      z-index: 10;
      flex-shrink: 0;
    }

    .camera-notch {
      width: 90px;
      height: 18px;
      background: #2b2520;
      border-radius: 0 0 12px 12px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    /* App Header */
    .app-header {
      padding: 8px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--shop-bg);
      flex-shrink: 0;
    }

    .header-title-wrap h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--shop-text-primary);
      letter-spacing: -0.3px;
    }

    .header-title-wrap p {
      font-size: 0.78rem;
      color: var(--shop-text-secondary);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-offline {
      background: var(--matcha-container);
      color: var(--matcha-secondary);
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-offline::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--matcha-secondary);
    }

    /* Main Scrollable Viewport */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px 85px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Items in a scrolling column must never be flex-shrunk: the scroll
       container absorbs overflow via scrolling, not by crushing cards.
       (crushed the NET PROFIT hero, whose overflow:hidden zeroes its
       automatic minimum size) */
    .screen-content > * {
      flex-shrink: 0;
    }

    .screen-content::-webkit-scrollbar {
      width: 4px;
    }
    .screen-content::-webkit-scrollbar-thumb {
      background: var(--shop-outline);
      border-radius: 4px;
    }

    /* Card Component */
    .card {
      background: var(--shop-surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 1px solid var(--shop-outline);
      box-shadow: var(--shop-card-shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    /* Hero Net Profit Card */
    .hero-card {
      background: linear-gradient(135deg, #4E2C1D 0%, #30170B 100%);
      color: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: 0 10px 28px rgba(78, 44, 29, 0.25);
      position: relative;
      overflow: hidden;
    }

    [data-theme="dark"] .hero-card {
      background: linear-gradient(135deg, #3A1F13 0%, #201108 100%);
      border: 1px solid rgba(226, 183, 161, 0.2);
    }

    .hero-card::after {
      content: '☕';
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 5rem;
      opacity: 0.12;
      pointer-events: none;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .hero-header > * {
      min-width: 0;
    }

    .hero-header .hero-label {
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-header .hero-period-pill {
      flex-shrink: 0;
    }

    .hero-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.92);
      font-weight: 700;
    }

    .hero-period-pill {
      background: rgba(255,255,255,0.22);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .hero-amount {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      color: #FFFFFF;
    }

    .hero-metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      background: rgba(0,0,0,0.18);
      border-radius: var(--radius-md);
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .metric-item {
      display: flex;
      flex-direction: column;
    }

    .metric-item .metric-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 2px;
    }

    .metric-item .metric-val {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .metric-val.green { color: #81C784; }
    .metric-val.red { color: #E57373; }
    .metric-val.gold { color: #FFD54F; }

    /* Period Filter Chips — wrap so every chip stays fully visible (no cut-off) */
    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-bottom: 2px;
    }

    .chip {
      background: var(--shop-surface-variant);
      color: var(--shop-text-secondary);
      border: 1px solid transparent;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--coffee-primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(78, 44, 29, 0.25);
    }

    [data-theme="dark"] .chip.active {
      background: var(--coffee-primary);
      color: #201108;
    }

    /* Low Stock Warning Banner */
    .alert-banner {
      background: var(--warning-bg);
      border: 1px solid rgba(230, 81, 0, 0.3);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .alert-banner:hover {
      transform: translateY(-1px);
    }

    .alert-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-icon {
      font-size: 1.25rem;
    }

    .alert-text h4 {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--warning-orange);
    }

    .alert-text p {
      font-size: 0.74rem;
      color: var(--shop-text-secondary);
    }

    .alert-btn {
      background: var(--warning-orange);
      color: #FFF;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Section Headings */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .section-head h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--shop-text-primary);
    }

    .section-head a, .section-head button {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--coffee-primary-light);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Category Breakdown Bars */
    .cat-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cat-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .cat-name-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .cat-dot.coffee { background: var(--coffee-primary-light); }
    .cat-dot.matcha { background: var(--matcha-secondary); }
    .cat-dot.macadamia { background: var(--macadamia-tertiary); }

    .cat-progress-track {
      height: 7px;
      background: var(--shop-surface-variant);
      border-radius: 10px;
      overflow: hidden;
    }

    .cat-progress-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cat-progress-fill.coffee { background: var(--coffee-primary-light); }
    .cat-progress-fill.matcha { background: var(--matcha-secondary); }
    .cat-progress-fill.macadamia { background: var(--macadamia-tertiary); }

    /* Recent Feed & Orders List */
    .item-card {
      background: var(--shop-surface);
      border-radius: var(--radius-md);
      padding: 14px;
      border: 1px solid var(--shop-outline);
      box-shadow: var(--shop-card-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .item-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--shop-text-primary);
    }

    .item-sub {
      font-size: 0.74rem;
      color: var(--shop-text-secondary);
      margin-top: 2px;
    }

    .item-badge {
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-pending { background: var(--pending-bg); color: var(--pending-blue); }
    .badge-preparing { background: var(--warning-bg); color: var(--warning-orange); }
    .badge-completed { background: var(--income-bg); color: var(--income-green); }
    .badge-cancelled { background: var(--outcome-bg); color: var(--outcome-red); }

    .badge-paid { background: var(--income-bg); color: var(--income-green); }
    .badge-unpaid { background: var(--outcome-bg); color: var(--outcome-red); }

    .order-items-preview {
      background: var(--shop-surface-variant);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.76rem;
      color: var(--shop-text-primary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .order-item-line {
      display: flex;
      justify-content: space-between;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed var(--shop-outline);
    }

    .total-price {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--coffee-primary-light);
    }

    [data-theme="dark"] .total-price {
      color: var(--coffee-primary);
    }

    .btn-action-sm {
      background: var(--shop-surface-variant);
      border: 1px solid var(--shop-outline);
      color: var(--shop-text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action-sm:hover {
      background: var(--coffee-primary);
      color: #FFFFFF;
      border-color: var(--coffee-primary);
    }

    .btn-primary-sm {
      background: var(--coffee-primary);
      border: none;
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    [data-theme="dark"] .btn-primary-sm {
      background: var(--coffee-primary);
      color: #1f1109;
    }

    /* Floating / Fixed Bottom Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--shop-surface);
      border-top: 1px solid var(--shop-outline);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      z-index: 20;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--shop-text-secondary);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      padding: 6px 0;
      border-radius: 12px;
      position: relative;
      transition: all 0.2s;
    }

    .nav-btn .icon {
      font-size: 1.25rem;
      transition: transform 0.2s;
    }

    .nav-btn.active {
      color: var(--coffee-primary);
    }

    [data-theme="dark"] .nav-btn.active {
      color: var(--coffee-primary);
    }

    .nav-btn.active .icon {
      transform: scale(1.15);
    }

    .nav-btn .badge-count {
      position: absolute;
      top: 2px;
      right: calc(50% - 18px);
      background: var(--outcome-red);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Sheet */
    .modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--shop-surface);
      border-radius: 28px 28px 0 0;
      padding: 22px 20px 28px;
      max-height: 84%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close {
      background: var(--shop-surface-variant);
      border: none;
      color: var(--shop-text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--shop-text-secondary);
    }

    .input-field, select.input-field {
      background: var(--shop-surface-variant);
      border: 1px solid var(--shop-outline);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.88rem;
      color: var(--shop-text-primary);
      outline: none;
      font-family: inherit;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--coffee-primary-light);
    }

    .btn-submit {
      background: var(--coffee-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 14px rgba(78, 44, 29, 0.25);
    }

    [data-theme="dark"] .btn-submit {
      background: var(--coffee-primary);
      color: #24140a;
    }

    /* Receipt Slip Styling */
    .receipt-slip {
      background: #FFFFFF;
      color: #1a1a1a;
      border: 1px dashed #bbb;
      border-radius: 12px;
      padding: 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .receipt-title {
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .receipt-divider {
      border-bottom: 1px dashed #888;
      margin: 10px 0;
    }

    /* Floating Action Button (FAB) */
    .fab {
      position: absolute;
      bottom: 82px;
      right: 20px;
      background: var(--coffee-primary);
      color: #FFFFFF;
      width: 52px;
      height: 52px;
      border-radius: 26px;
      display: flex;
      align-items: center;

    // Helper currency formatter for Myanmar Kyat (MMK)
    function formatMMK(amount) {
      return new Intl.NumberFormat('en-US').format(Math.round(amount)) + ' MMK';
    }

    // Raw qty formatter: whole numbers without decimals, else up to 2 decimals
    function formatRawQty(qty, unit) {
      const n = Number(qty) || 0;
      const q = Number.isInteger(n) ? n.toString() : (Math.round(n * 100) / 100).toString();
      return q + ' ' + unit;
    }

    function rawBought(materialId) {
      return STATE.rawMovements
        .filter(m => m.materialId === materialId && m.type === 'PURCHASE')
        .reduce((s, m) => s + Number(m.qty || 0), 0);
    }

    function rawUsed(materialId) {
      return STATE.rawMovements
        .filter(m => m.materialId === materialId && m.type === 'USAGE')
        .reduce((s, m) => s + Number(m.qty || 0), 0);
    }

    // --- Credit tabs / discounts / close-out helpers (mirror native repo) ---
    function orderNet(order) {
      return Math.max(0, (order.totalAmount || 0) - (order.discount || 0));
    }

    function paidForOrder(orderId) {
      return STATE.payments
        .filter(p => p.orderId === orderId)
        .reduce((s, p) => s + Number(p.amount || 0), 0);
    }

    function amountDue(order) {
      if (order.paymentStatus === 'PAID') return 0;
      return Math.max(0, orderNet(order) - paidForOrder(order.id));
    }

    function formatDateOnly(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function expiryBadge(exp) {
      if (!exp) return '';
      const now = Date.now(), day = 86400000;
      if (exp <= now) return { text: '⛔ Expired ' + formatDateOnly(exp), cls: 'stock-out' };
      if (exp - now <= 7 * day) return { text: '⏳ Expires ' + formatDateOnly(exp), cls: 'stock-low' };
      return { text: 'Expires ' + formatDateOnly(exp), cls: 'stock-healthy' };
    }

    function startOfDay(ts) {
      const d = new Date(ts);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    function computeCloseout(dayStart) {
      const day = 86400000, dayEnd = dayStart + day;
      const inDay = ts => ts >= dayStart && ts < dayEnd;
      const dayOrders = STATE.orders.filter(o => inDay(o.timestamp) && o.status !== 'CANCELLED');
      const gross = dayOrders.reduce((s, o) => s + (o.totalAmount || 0), 0);
      const discounts = dayOrders.reduce((s, o) => s + (o.discount || 0), 0);
      const net = dayOrders.reduce((s, o) => s + orderNet(o), 0);
      const income = STATE.transactions.filter(t => inDay(t.timestamp) && t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
      const outcome = STATE.transactions.filter(t => inDay(t.timestamp) && t.type === 'OUTCOME').reduce((s, t) => s + t.amount, 0);
      const byMethod = {};
      dayOrders.filter(o => o.paymentStatus === 'PAID').forEach(o => {
        byMethod[o.paymentMethod] = (byMethod[o.paymentMethod] || 0) + orderNet(o);
      });
      STATE.payments.filter(p => inDay(p.timestamp)).forEach(p => {
        byMethod[p.method] = (byMethod[p.method] || 0) + p.amount;
      });
      const prodMap = {};
      dayOrders.forEach(o => o.items.forEach(i => {
        prodMap[i.productName] = prodMap[i.productName] || { qty: 0, rev: 0 };
        prodMap[i.productName].qty += i.quantity;
        prodMap[i.productName].rev += i.price * i.quantity;
      }));
      const topProducts = Object.entries(prodMap)
        .map(([name, v]) => ({ name, qty: v.qty, rev: v.rev }))
        .sort((a, b) => b.rev - a.rev).slice(0, 5);
      const useMap = {};
      STATE.rawMovements.filter(m => inDay(m.timestamp) && m.type === 'USAGE').forEach(m => {
        useMap[m.materialId] = (useMap[m.materialId] || 0) + Number(m.qty || 0);
      });
      const rawUsedList = Object.entries(useMap).map(([id, qty]) => {
        const m = STATE.rawMaterials.find(x => x.id === parseInt(id));
        return m ? { name: m.name, unit: m.unit, qty } : null;
      }).filter(Boolean).sort((a, b) => b.qty - a.qty);
      const tabsOpened = dayOrders.filter(o => o.paymentStatus === 'UNPAID').reduce((s, o) => s + amountDue(o), 0);
      const tabsCollected = STATE.payments.filter(p => inDay(p.timestamp)).reduce((s, p) => s + p.amount, 0);
      const tabsOutstanding = STATE.orders
        .filter(o => o.status !== 'CANCELLED' && o.paymentStatus === 'UNPAID')
        .reduce((s, o) => s + amountDue(o), 0);
      return {
        dayStart, gross, discounts, net, income, outcome, netCash: income - outcome,
        count: dayOrders.length, avg: dayOrders.length ? net / dayOrders.length : 0,
        byMethod: Object.entries(byMethod).map(([m, a]) => ({ m, a })).sort((a, b) => b.a - a.a),
        topProducts, rawUsedList, tabsOpened, tabsCollected, tabsOutstanding
      };
    }

    function revenueTrend(days) {
      const out = [];
      const today = startOfDay(Date.now()), day = 86400000;
      for (let back = days - 1; back >= 0; back--) {
        const start = today - back * day;
        const rev = STATE.orders
          .filter(o => o.status !== 'CANCELLED' && o.timestamp >= start && o.timestamp < start + day)
          .reduce((s, o) => s + orderNet(o), 0);
        out.push({ label: new Date(start).toLocaleDateString('en-US', { weekday: 'short' }), rev });
      }
      return out;
    }

    function formatTimeAgo(timestamp) {
      const diff = Math.floor((Date.now() - timestamp) / 1000);
      if (diff < 60) return "Just now";
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

      const pendingOrders = STATE.orders.filter(o => o.status === 'PENDING' || o.status === 'PREPARING').length;

    function renderCurrentScreen() {
      const container = document.getElementById('screenContent');

        renderOrders(container);
      } else if (STATE.currentTab === 'inventory') {
        renderInventory(container);
      } else if (STATE.currentTab === 'finance') {
        renderFinance(container);
      }
      // The scrollable viewport keeps its position across re-renders, which left
      // the top card scrolled out of sight after switching tabs — always start at top.
      container.scrollTop = 0;

    // 1. DASHBOARD SCREEN

    // --- Offline backup: download JSON / restore from file ---
    function csvStamp(ts) {
      const d = new Date(ts || Date.now());
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function csvCell(v) {
      const s = v === null || v === undefined ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function csvMmk(n) {
      return String(Math.round(Number(n) || 0));
    }

    function downloadFile(name, content, mime) {
      const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }

    function stampName(prefix, ext) {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${prefix}-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
    }

    function transactionsCsv() {
      const rows = ['id,date,type,category,amount_mmk,title,note,order_ref'];
      STATE.transactions.forEach(t => {
        rows.push([t.id, csvStamp(t.timestamp), t.type, t.category, csvMmk(t.amount),
          csvCell(t.title), csvCell(t.note), csvCell(t.refOrder || '')].join(','));
      });
      return rows.join('\n');
    }

    function ordersCsv() {
      const rows = ['order_number,date,customer,phone,status,payment_status,payment_method,item_name,qty,unit_price_mmk,subtotal_mmk,order_gross_mmk,discount_mmk,discount_reason,order_net_mmk'];
      STATE.orders.forEach(o => {
        const base = [o.orderNumber, csvStamp(o.timestamp), csvCell(o.customerName), csvCell(o.customerPhone || ''),
          o.status, o.paymentStatus, o.paymentMethod];
        const tail = [csvMmk(o.totalAmount), csvMmk(o.discount || 0), csvCell(o.discountReason || ''), csvMmk(orderNet(o))];
        if (!o.items.length) {
          rows.push([...base, '', '', '', '', ...tail].join(','));
        } else {
          o.items.forEach(i => {
            rows.push([...base, csvCell(i.productName), i.quantity, csvMmk(i.price),
              csvMmk(i.price * i.quantity), ...tail].join(','));
          });
        }
      });
      return rows.join('\n');
    }

    function productsCsv() {
      const rows = ['id,name,category,sku,unit,stock,min_stock,cost_mmk,price_mmk,expiry_date'];
      STATE.products.forEach(p => {
        rows.push([p.id, csvCell(p.name), p.category, csvCell(p.sku || ''), csvCell(p.unit),
          p.stock, p.minStock, csvMmk(p.cost), csvMmk(p.price),
          p.expiryDate ? csvStamp(p.expiryDate) : ''].join(','));
      });
      return rows.join('\n');
    }

    function rawCsv() {
      const rows = ['id,name,sku,unit,bought,used,remaining,min_threshold,expiry_date'];
      STATE.rawMaterials.forEach(m => {
        rows.push([m.id, csvCell(m.name), csvCell(m.sku || ''), csvCell(m.unit),
          rawBought(m.id), rawUsed(m.id), m.stock, m.minStock,
          m.expiryDate ? csvStamp(m.expiryDate) : ''].join(','));
      });
      return rows.join('\n');
    }

    function paymentsCsv() {
      const rows = ['id,date,order_number,customer,amount_mmk,method'];
      STATE.payments.forEach(p => {
        const o = STATE.orders.find(x => x.id === p.orderId);
        rows.push([p.id, csvStamp(p.timestamp), o ? o.orderNumber : ('#' + p.orderId),
          csvCell(o ? o.customerName : ''), csvMmk(p.amount), p.method].join(','));
      });
      return rows.join('\n');
    }

    function closeoutText() {
      const co = computeCloseout(startOfDay(Date.now()));
      const dateStr = new Date(co.dayStart).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      return [
        'BLANC COFFEE — DAY CLOSE-OUT', dateStr, '------------------------------',
        `Orders: ${co.count}`, `Gross sales: ${formatMMK(co.gross)}`, `Discounts: -${formatMMK(co.discounts)}`,
        `Net sales: ${formatMMK(co.net)}`, `Cash in (ledger): +${formatMMK(co.income)}`,
        `Cash out (ledger): -${formatMMK(co.outcome)}`, `Net cash: ${formatMMK(co.netCash)}`,
        '------------------------------',
        ...co.byMethod.map(m => `${m.m}: ${formatMMK(m.a)}`),
        '------------------------------',
        ...co.topProducts.map(p => `${p.name} x${p.qty} = ${formatMMK(p.rev)}`),
        '------------------------------',
        `Tabs opened: ${formatMMK(co.tabsOpened)}`, `Tabs collected: ${formatMMK(co.tabsCollected)}`,
        `Tabs outstanding: ${formatMMK(co.tabsOutstanding)}`
      ].join('\n');
    }

    function exportData() {
      const fmt = (document.getElementById('exportFormat') || {}).value || 'json';
      if (fmt === 'json') { exportBackup(); return; }
      const builders = {
        finance: ['finance-ledger', transactionsCsv, 'csv', 'text/csv;charset=utf-8'],
        orders: ['orders', ordersCsv, 'csv', 'text/csv;charset=utf-8'],
        inventory: ['products', productsCsv, 'csv', 'text/csv;charset=utf-8'],
        raw: ['raw-materials', rawCsv, 'csv', 'text/csv;charset=utf-8'],
        payments: ['tab-payments', paymentsCsv, 'csv', 'text/csv;charset=utf-8'],
        closeout: ['closeout', closeoutText, 'txt', 'text/plain;charset=utf-8']
      };
      const b = builders[fmt];
      if (!b) return;
      downloadFile(stampName('blanc-coffee-' + b[0], b[2]), b[1](), b[3]);
      showToast('File exported — open it in Excel/Sheets.');
    }

    function exportBackup() {
      const data = {
        app: 'blanc-coffee', version: 1, exportedAt: Date.now(),
        products: STATE.products, orders: STATE.orders, transactions: STATE.transactions,
        rawMaterials: STATE.rawMaterials, rawMovements: STATE.rawMovements,
        recipes: STATE.recipes, payments: STATE.payments
      };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      a.href = URL.createObjectURL(blob);
      a.download = `blanc-coffee-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      showToast('Backup downloaded — keep it safe!');
    }

    function importBackupFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.app !== 'blanc-coffee' || data.version !== 1 || !Array.isArray(data.products) || !Array.isArray(data.orders)) {
            alert('Not a valid BLANC COFFEE backup file.');
            return;
          }
          if (!confirm(`Restore backup from ${new Date(data.exportedAt).toLocaleString()}? Current data will be replaced.`)) return;
          STATE.products = data.products;
          STATE.orders = data.orders || [];
          STATE.transactions = data.transactions || [];
          STATE.rawMaterials = data.rawMaterials || [];
          STATE.rawMovements = data.rawMovements || [];
          STATE.recipes = data.recipes || [];
          STATE.payments = data.payments || [];
          showToast('Backup restored!');
          updateBadges();
          renderCurrentScreen();
        } catch (e) {
          alert('Backup file is corrupt.');
        }
        input.value = '';
      };
      reader.readAsText(file);
    }

    // --- Collect (partial/full) payment on an UNPAID tab order ---
    function openCollectModal(orderId) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;
      const due = amountDue(order);
      const html = `
        <div class="modal-header">

          <div><strong>Customer:</strong> ${order.customerName}</div>
          <div><strong>Due now:</strong> ${formatMMK(due)}${(order.discount || 0) > 0 ? ` (net of ${formatMMK(order.discount)} discount)` : ''}</div>
          <div><strong>Already paid:</strong> ${formatMMK(paidForOrder(order.id))}</div>
        </div>
        <div class="form-group">
          <label>Amount received (MMK)</label>
          <input type="number" class="input-field" id="collectAmount" value="${due}" min="1">
        </div>
        <div class="form-group">
          <label>Method</label>
          <select class="input-field" id="collectMethod">
            <option value="CASH">Cash</option>
            <option value="KBZPAY">KBZPay</option>
            <option value="CB_PAY">CB Pay</option>
            <option value="AYA_PAY">AYA Pay</option>
            <option value="CARD">Card</option>
          </select>
        </div>
        <button class="btn-submit" onclick="submitCollect(${order.id})">Record Payment</button>
      `;
      openModal(html);
    }

    function submitCollect(orderId) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;
      const due = amountDue(order);
      const amount = parseFloat(document.getElementById('collectAmount').value) || 0;
      const method = document.getElementById('collectMethod').value;
      if (amount <= 0 || amount > due + 0.009) {
        alert(`Enter an amount between 1 and ${formatMMK(due)}.`);
        return;
      }
      STATE.payments.unshift({ id: Date.now(), orderId, amount, method, note: '', timestamp: Date.now() });
      const left = due - amount;
      if (left <= 0.009) {
        order.paymentStatus = 'PAID';
        if (!STATE.transactions.some(t => t.refOrder === order.orderNumber && t.type === 'INCOME' && t.amount > 0)) {
          STATE.transactions.unshift({
            id: Date.now() + 1, type: 'INCOME', category: 'ORDER_SALE', amount: orderNet(order),
            title: `Order #${order.orderNumber} - ${order.customerName}`,
            note: 'Tab settled in full', timestamp: Date.now(), refOrder: order.orderNumber
          });
        }
        showToast(`Tab ${order.orderNumber} settled in full!`);
      } else {
        showToast(`Recorded ${formatMMK(amount)} — ${formatMMK(left)} still owed.`);
      }
      closeModal();
      updateBadges();
      renderCurrentScreen();
    }

    function advanceOrderStatus(orderId, nextStatus) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;
      order.status = nextStatus;

      // Completing an UNPAID order leaves the tab open (collect via Collect button).
      // Only auto-settle when partial payments already cover the net.
      if (nextStatus === 'COMPLETED' && order.paymentStatus === 'UNPAID') {
        if (amountDue(order) <= 0.009 && !STATE.transactions.some(t => t.refOrder === order.orderNumber && t.type === 'INCOME' && t.amount > 0)) {
          order.paymentStatus = 'PAID';
          STATE.transactions.unshift({
            id: Date.now(),
            type: 'INCOME',
            category: 'ORDER_SALE',
            amount: orderNet(order),
            title: `Order #${order.orderNumber} - ${order.customerName}`,
            note: `Tab settled in full`,
            timestamp: Date.now(),
            refOrder: order.orderNumber
          });
        }
      }

      showToast(`Order ${order.orderNumber} marked as ${nextStatus}!`);
      updateBadges();
      renderCurrentScreen();
    }

    function cancelOrder(orderId) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;

      if (!confirm(`Cancel order ${order.orderNumber}? This will restore inventory and issue a refund if paid.`)) return;

      order.status = 'CANCELLED';

      // Restore stock (stocked products only — made-to-order took none)
      order.items.forEach(item => {
        const prod = STATE.products.find(p => p.id === item.productId);
        if (prod && !prod.madeToOrder) prod.stock += item.quantity;
      });

      // Compensating refund transaction if it was paid
      if (order.paymentStatus === 'PAID') {
        STATE.transactions.unshift({
          id: Date.now(),
          type: 'OUTCOME',
          category: 'ORDER_REFUND',
          amount: order.totalAmount,
          title: `Refund: Order #${order.orderNumber}`,
          note: `Compensating refund for cancelled order`,
          timestamp: Date.now(),
          refOrder: order.orderNumber
        });
      }

      showToast(`Order ${order.orderNumber} cancelled. Stock restored.`);
      updateBadges();
      renderCurrentScreen();
    }

    function adjustDraftItem(prodId, delta) {
      const p = STATE.products.find(prod => prod.id === prodId);
      if (!p) return;
      const current = window._orderDraft.selectedProducts[prodId] || 0;
      const target = current + delta;
      if (target < 0) return;
      if (!p.madeToOrder && target > p.stock) {
        alert(`Cannot add more: Only ${p.stock} ${p.unit} currently in stock.`);
        return;
      }

      if (target === 0) {
        delete window._orderDraft.selectedProducts[prodId];
      } else {
        window._orderDraft.selectedProducts[prodId] = target;
      }

      const qtyEl = document.getElementById(`draftQty_${prodId}`);
      if (qtyEl) qtyEl.innerText = target;

      updateDraftTotal();
    }

    function updateDraftTotal() {
      // Update total (net of discount)
      let total = 0;
      for (const [id, q] of Object.entries(window._orderDraft.selectedProducts)) {
        const itemP = STATE.products.find(prod => prod.id === parseInt(id));
        if (itemP) total += (itemP.price * q);
      }
      const disc = Math.min(Math.max(0, window._orderDraft.discount || 0), total);
      document.getElementById('draftTotalAmount').innerText =
        formatMMK(total - disc) + (disc > 0 ? ` (discount ${formatMMK(disc)})` : '');
    }

    function submitDraftOrder() {
      const draft = window._orderDraft;
      if (!draft.name.trim()) {
        alert("Please enter customer name.");
        return;
      }
      const itemKeys = Object.keys(draft.selectedProducts);
      if (itemKeys.length === 0) {
        alert("Please select at least one item.");
        return;
      }

      // Generate ORD-#
      const maxNum = STATE.orders.reduce((max, o) => {
        const num = parseInt(o.orderNumber.replace('ORD-', '')) || 0;
        return Math.max(max, num);
      }, 1000);
      const nextOrdNum = `ORD-${maxNum + 1}`;

      const items = [];
      let totalAmount = 0;
      let totalCost = 0;

      for (const [prodIdStr, qty] of Object.entries(draft.selectedProducts)) {
        const prod = STATE.products.find(p => p.id === parseInt(prodIdStr));
        if (prod) {
          if (!prod.madeToOrder) prod.stock -= qty; // stocked only; fresh items skip
          totalAmount += (prod.price * qty);
          totalCost += (prod.cost * qty);
          items.push({
            productId: prod.id,
            productName: prod.name,
            quantity: qty,
            price: prod.price
          });
          // Auto-consume raw ingredients via recipes (never blocks the sale)
          STATE.recipes
            .filter(r => r.productId === prod.id)
            .forEach(r => {
              const raw = STATE.rawMaterials.find(m => m.id === r.materialId);
              if (!raw) return;
              const needed = r.qtyPerUnit * qty;
              if (needed <= 0) return;
              raw.stock = Math.max(0, raw.stock - needed);
              STATE.rawMovements.unshift({
                id: Date.now() + Math.floor(Math.random() * 1000),
                materialId: raw.id,
                type: "USAGE",
                qty: needed,
                cost: 0,
                note: "Auto-use for " + nextOrdNum + " (" + prod.name + " x" + qty + ")",
                timestamp: Date.now()
              });
            });
        }
      }

      const newOrder = {
        id: Date.now(),
        orderNumber: nextOrdNum,
        customerName: draft.name,
        customerPhone: draft.phone || "+95 9 12345678",
        customerNote: draft.note || "",
        status: "PENDING",
        paymentStatus: draft.isPaid ? "PAID" : "UNPAID",
        paymentMethod: draft.paymentMethod,
        totalAmount,
        totalCost,
        discount: Math.min(Math.max(0, draft.discount || 0), totalAmount),
        discountReason: draft.discountReason || "",
        timestamp: Date.now(),
        items
      };

      STATE.orders.unshift(newOrder);

      // Record income if paid (net of discount)
      if (draft.isPaid) {
        STATE.transactions.unshift({
          id: Date.now() + 1,
          type: "INCOME",
          category: "ORDER_SALE",
          amount: orderNet(newOrder),
          title: `Order #${nextOrdNum} - ${draft.name}`,
          note: items.map(i => `${i.quantity}x ${i.productName}`).join(', ') +
            (newOrder.discount > 0 ? ` | Discount ${formatMMK(newOrder.discount)}` : ''),
          timestamp: Date.now(),
          refOrder: nextOrdNum
        });
      }

      closeModal();
      showToast(`Order ${nextOrdNum} placed successfully!`);
      updateBadges();
      renderCurrentScreen();
      openOrderReceipt(newOrder.id);
    }

    // Modal 2: Order Receipt Slip
    function openOrderReceipt(orderId) {
      const order = STATE.orders.find(o => o.id === orderId);
      if (!order) return;

      const dateStr = new Date(order.timestamp).toLocaleString('en-US', {
        dateStyle: 'medium',
        timeStyle: 'short'
      });

      const slipText = `================================\n   BLANC COFFEE — ORDER SLIP\n       Yangon, Myanmar\n================================\nOrder #: ${order.orderNumber}\nDate: ${dateStr}\nCustomer: ${order.customerName}\nPhone: ${order.customerPhone}\n--------------------------------\n${order.items.map(i => `${i.quantity}x ${i.productName.substring(0, 22)}\n   @ ${formatMMK(i.price)} = ${formatMMK(i.price * i.quantity)}`).join('\n')}\n--------------------------------\nSUBTOTAL: ${formatMMK(order.totalAmount)}\n${(order.discount || 0) > 0 ? `DISCOUNT: -${formatMMK(order.discount)}${order.discountReason ? ' (' + order.discountReason + ')' : ''}\n` : ''}TOTAL: ${formatMMK(orderNet(order))}\nPAYMENT: ${order.paymentStatus} (${order.paymentMethod})\nSTATUS: ${order.status}\n================================\nThank you for choosing BLANC COFFEE!\nကျေးဇူးတင်ပါသည်`;

      const html = `
        <div class="modal-header">
          <h3>Order Slip & Receipt</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div class="receipt-slip">
          <div class="receipt-title">☕ BLANC COFFEE</div>
          <div style="text-align:center; font-size:0.74rem;">Specialty Coffee, Tea & Nuts • Myanmar</div>
          <div class="receipt-divider"></div>
          <div><strong>Order:</strong> ${order.orderNumber}</div>
          <div><strong>Date:</strong> ${dateStr}</div>
          <div><strong>Customer:</strong> ${order.customerName}</div>
          <div><strong>Phone:</strong> ${order.customerPhone}</div>
          ${order.customerNote ? `<div><strong>Note:</strong> ${order.customerNote}</div>` : ''}
          <div class="receipt-divider"></div>
          ${order.items.map(item => `
            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
              <span>${item.quantity}x ${item.productName}</span>
              <span>${formatMMK(item.price * item.quantity)}</span>
            </div>
          `).join('')}
          <div class="receipt-divider"></div>
          <div style="display:flex; justify-content:space-between; font-size:0.78rem;">
            <span>Subtotal:</span>
            <span>${formatMMK(order.totalAmount)}</span>
          </div>
          ${(order.discount || 0) > 0 ? `
          <div style="display:flex; justify-content:space-between; font-size:0.78rem;">
            <span>Discount${order.discountReason ? ' (' + order.discountReason + ')' : ''}:</span>
            <span>-${formatMMK(order.discount)}</span>
          </div>` : ''}
          <div style="display:flex; justify-content:space-between; font-size:1rem; font-weight:bold;">
            <span>TOTAL DUE:</span>
            <span>${formatMMK(orderNet(order))}</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-top:4px;">
            <span>Payment: ${order.paymentStatus}</span>
            <span>Method: ${order.paymentMethod}</span>
          </div>
          <div class="receipt-divider"></div>
          <div style="text-align:center; font-size:0.75rem;">Thank you! ကျေးဇူးတင်ပါသည်</div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <button class="btn-action-sm" style="padding:12px;" onclick="copySlipText(\`${slipText.replace(/`/g, "\\`")}\`)">📋 Copy Text Slip</button>
          <button class="btn-submit" style="margin:0; padding:12px;" onclick="shareSlip('${order.orderNumber}')">📲 Share (Viber/Telegram)</button>
        </div>
      `;

      openModal(html);
    }

    function copySlipText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Order slip copied to clipboard!");
      });
    }

    function shareSlip(orderNum) {
      showToast(`Sharing Order ${orderNum} slip...`);
    }

    // Modal 3: Restock Inventory
    function openRestockModal(prodId) {
      const prod = STATE.products.find(p => p.id === prodId);
      if (!prod) return;

      const html = `
        <div class="modal-header">
          <h3>Restock ${prod.name}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div style="background:var(--shop-surface-variant); padding:12px; border-radius:12px; font-size:0.82rem;">
          <div><strong>Current Stock:</strong> ${prod.stock} ${prod.unit}</div>
          <div><strong>Threshold:</strong> ${prod.minStock} ${prod.unit}</div>
          <div><strong>Default Cost Price:</strong> ${formatMMK(prod.cost)} / ${prod.unit}</div>
        </div>

        <div class="form-group">
          <label>Quantity to Restock (${prod.unit})</label>
          <input type="number" class="input-field" id="restockQty" value="10" min="1" oninput="updateRestockExpense(${prod.cost})">
        </div>

        <div class="form-group">
          <label>Unit Cost in MMK</label>
          <input type="number" class="input-field" id="restockCost" value="${prod.cost}" oninput="updateRestockExpense(null)">
        </div>

        <div class="form-group">
          <label>Supplier / Batch Note</label>
          <input type="text" class="input-field" id="restockNote" placeholder="Fresh harvest roast batch from supplier">
        </div>

        <div style="background:var(--outcome-bg); border-radius:12px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.72rem; color:var(--outcome-red); font-weight:600;">Total Restock Expense</div>
            <div id="restockTotalExpense" style="font-family:'Outfit'; font-size:1.15rem; font-weight:800; color:var(--outcome-red);">${formatMMK(10 * prod.cost)}</div>
          </div>
          <button class="btn-submit" onclick="submitRestock(${prod.id})" style="margin:0; background:var(--outcome-red);">Confirm Restock</button>
        </div>
      `;

      openModal(html);
    }

    function updateRestockExpense() {
      const qty = parseInt(document.getElementById('restockQty').value) || 0;
      const cost = parseFloat(document.getElementById('restockCost').value) || 0;
      document.getElementById('restockTotalExpense').innerText = formatMMK(qty * cost);
    }

    function submitRestock(prodId) {
      const prod = STATE.products.find(p => p.id === prodId);
      if (!prod) return;

      const qty = parseInt(document.getElementById('restockQty').value) || 0;
      const cost = parseFloat(document.getElementById('restockCost').value) || 0;
      const note = document.getElementById('restockNote').value || "Inventory restocking batch";

      if (qty <= 0) {
        alert("Quantity must be greater than 0");
        return;
      }

      prod.stock += qty;
      prod.cost = cost;

      // Auto-log Restocking Expense in Finance
      STATE.transactions.unshift({
        id: Date.now(),
        type: "OUTCOME",
        category: "RESTOCKING",
        amount: qty * cost,
        title: `Restocked ${qty}x ${prod.name}`,
        note: note,
        timestamp: Date.now()
      });

      closeModal();
      showToast(`Added ${qty} ${prod.unit} to stock! Expense recorded in Finance.`);
      updateBadges();
      renderCurrentScreen();
    }

    // Modal 4: Add New Transaction to Finance
    function openAddTransactionModal() {
      const html = `
        <div class="modal-header">
          <h3>Record Transaction</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div class="form-group">
          <label>Transaction Type</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="chip active" id="txTypeInc" onclick="setDraftTxType('INCOME')" style="text-align:center;">Inflow (+ Income)</button>
            <button class="chip" id="txTypeOut" onclick="setDraftTxType('OUTCOME')" style="text-align:center;">Outflow (- Expense)</button>
          </div>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select class="input-field" id="txCategory">
            <option value="ORDER_SALE">Order Sale</option>
            <option value="WHOLESALE">Wholesale Sale</option>
            <option value="RESTOCKING">Restocking Expense</option>
            <option value="PACKAGING">Packaging & Labels</option>
            <option value="UTILITIES">Utilities & Power</option>
            <option value="EQUIPMENT">Equipment & Maintenance</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Amount in MMK</label>
          <input type="number" class="input-field" id="txAmount" placeholder="e.g. 50000">
        </div>

        <div class="form-group">
          <label>Title / Description</label>
          <input type="text" class="input-field" id="txTitle" placeholder="e.g. Grinder burr replacement">
        </div>

        <div class="form-group">
          <label>Notes</label>
          <input type="text" class="input-field" id="txNote" placeholder="Additional details...">
        </div>

        <button class="btn-submit" onclick="submitTransaction()">Save Entry</button>
      `;

      window._draftTxType = 'INCOME';
      openModal(html);
    }

    function setDraftTxType(type) {
      window._draftTxType = type;
      document.getElementById('txTypeInc').classList.toggle('active', type === 'INCOME');
      document.getElementById('txTypeOut').classList.toggle('active', type === 'OUTCOME');
    }

    function submitTransaction() {
      const amount = parseFloat(document.getElementById('txAmount').value) || 0;
      const title = document.getElementById('txTitle').value.trim();
      const cat = document.getElementById('txCategory').value;
      const note = document.getElementById('txNote').value.trim();

      if (amount <= 0 || !title) {
        alert("Please provide a valid amount and title.");
        return;
      }

      STATE.transactions.unshift({
        id: Date.now(),
        type: window._draftTxType,
        category: cat,
        amount: amount,
        title: title,
        note: note,
        timestamp: Date.now()
      });

      closeModal();
      showToast("Transaction saved to ledger!");
      renderCurrentScreen();
    }

    // Modal 5: Add Product
    function openAddProductModal() {
      const html = `
        <div class="modal-header">
          <h3>Add Product to Catalog</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div class="form-group">
          <label>Product Name</label>
          <input type="text" class="input-field" id="newProdName" placeholder="e.g. Cascara Coffee Cherry Tea">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select class="input-field" id="newProdCategory">
            <option value="COFFEE">Coffee</option>
            <option value="GREEN_TEA">Green Tea</option>
            <option value="MACADAMIA_NUT">Macadamia Nut</option>
          </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Cost Price (MMK)</label>
            <input type="number" class="input-field" id="newProdCost" placeholder="8000">
          </div>
          <div class="form-group">
            <label>Selling Price (MMK)</label>
            <input type="number" class="input-field" id="newProdPrice" placeholder="15000">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Initial Stock</label>
            <input type="number" class="input-field" id="newProdStock" placeholder="20">
          </div>
          <div class="form-group">
            <label>Unit (bags, tins, pouches)</label>
            <input type="text" class="input-field" id="newProdUnit" placeholder="bags">
          </div>
        </div>

        <div class="form-group">
          <label>SKU Code</label>
          <input type="text" class="input-field" id="newProdSku" placeholder="e.g. TEA-CAS-100">
        </div>

        <div class="form-group">
          <label>Expiry Date (optional, for perishables)</label>
          <input type="date" class="input-field" id="newProdExpiry">
        </div>

        <div class="form-group">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="newProdMTO" style="width:18px; height:18px;">
            🔥 Made to order (produce fresh — stock never blocks sales)
          </label>
        </div>

        <button class="btn-submit" onclick="submitNewProduct()">Add to Inventory</button>
      `;

      openModal(html);
    }

    function submitNewProduct() {
      const name = document.getElementById('newProdName').value.trim();
      const cat = document.getElementById('newProdCategory').value;
      const cost = parseFloat(document.getElementById('newProdCost').value) || 0;
      const price = parseFloat(document.getElementById('newProdPrice').value) || 0;
      const stock = parseInt(document.getElementById('newProdStock').value) || 0;
      const unit = document.getElementById('newProdUnit').value.trim() || 'units';
      const sku = document.getElementById('newProdSku').value.trim() || `PRD-${Date.now().toString().slice(-4)}`;
      const expiryVal = document.getElementById('newProdExpiry').value;
      const expiryDate = expiryVal ? new Date(expiryVal + 'T00:00:00').getTime() : null;
      const madeToOrder = !!document.getElementById('newProdMTO').checked;

      if (!name || price <= 0) {
        alert("Please enter product name and selling price.");
        return;
      }

      STATE.products.push({
        id: Date.now(),
        name,
        category: cat,
        cost,
        price,
        stock,
        unit,
        minStock: 5,
        sku,
        expiryDate,
        madeToOrder,
        desc: "Specialty item added to catalog."
      });

      closeModal();
      showToast(`${name} added to catalog!`);
      updateBadges();
      renderCurrentScreen();
    }

    // --- Controls: Theme & View Toggles ---
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('themeIcon').innerText = next === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeToggleBtn').innerHTML = next === 'dark' 
        ? '<span id="themeIcon">☀️</span> Light' 
        : '<span id="themeIcon">🌙</span> Dark';
    }

    function toggleViewSize() {
      const shell = document.getElementById('deviceShell');
      const isFull = shell.classList.toggle('fullscreen');
      document.getElementById('viewIcon').innerText = isFull ? '💻' : '📱';
      document.getElementById('viewToggleBtn').innerHTML = isFull 
        ? '<span id="viewIcon">📱</span> Mobile Frame' 
        : '<span id="viewIcon">💻</span> Expanded View';
    }

    // Live Clock in Status Bar
    function updateClock() {
      const d = new Date();
      let h = d.getHours();
      let m = d.getMinutes();
      if (m < 10) m = '0' + m;
      document.getElementById('clockTime').innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 10000);
    updateClock();

    // Initial render
    switchTab('dashboard');
  </script>
</body>
</html>
